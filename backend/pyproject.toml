[project]
name = "careerkit-backend"
version = "0.1.0"
description = "CareerkitAgent 求职入职系统后端 - Harness 模式 Agent 平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "minio>=7.2",
    "cryptography>=42.0",
    "httpx>=0.27",
    "trafilatura>=1.12",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "openai>=1.40",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
